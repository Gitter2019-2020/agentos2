name: Copilot Common

on:
  workflow_call:
    inputs:
      prompt:
        required: true
        type: string
      model:
        required: false
        type: string
        default: "gpt-5"

jobs:
  copilot:
    runs-on: ubuntu-latest

    steps:
      - name: Configure Copilot
        run: |
          npm install -g @github/copilot

          mkdir -p ~/.copilot

          cat > ~/.copilot/mcp-config.json << EOF
          {
            "mcpServers": {
              "gh-mcp": {
                "type": "http",
                "url": "https://github-mcp.ypto-sdcoe.com/",
                "headers": {
                  "Authorization": "Bearer ${{ secrets.TEST }}"
                }
              }
            }
          }
          EOF
          echo "******************************************************"
          copilot mcp disable github-mcp-server
          echo "******************************************************"
          copilot mcp list
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEST: ${{ secrets.TEST }}  

      - name: Verify model
        shell: bash
        run: |
          if ! copilot models | grep -Fxq "${{ inputs.model }}"; then
            echo "ERROR: Model '${{ inputs.model }}' is not available."
            echo ""
            echo "Available models:"
            copilot models
            exit 1
          fi

      - name: Run Copilot
        run: |
          copilot -p "
              Use ONLY the MCP server named gh-mcp.

              Repository owner/repo:
              ${{ github.repository }}

              ${{ inputs.prompt }}
          " \
          --model "${{ inputs.model }}" \
          -s \
          --assisted-approval
        env:
          GITHUB_TOKEN: ${{ github.token }}