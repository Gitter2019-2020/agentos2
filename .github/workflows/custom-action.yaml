name: AI inference

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  copilot-requests: write

jobs:
  copilot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Copilot CLI
        run: npm install -g @github/copilot
          
      - name: Run Copilot
        id: copilot
        run: |
          mkdir -p ~/.copilot

          cat > ~/.copilot/mcp-config.json << EOF
          {
            "mcpServers": {
              "gh-mcp": {
                "type": "http",
                "url": "https://github-mcp.ypto-sdcoe.com/",
                "headers": {
                  "Authorization": "Bearer ${{ secrets.TEST }}"
                }
              }
            }
          }
          EOF
          echo "******************************************************"
          copilot mcp disable github-mcp-server
          echo "******************************************************"
          copilot mcp list
          echo "******************************************************"

          copilot -p "Create a new issue with title 'this is amazing' and body you can fill with some random text" -s --assisted-approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEST: ${{ secrets.TEST }}

      # - name: Add comment
      #   run: |
      #     gh issue comment \
      #       ${{ github.event.issue.number }} \
      #       --body "This is my summary:

      #     ${{ steps.copilot.outputs.response }}"
