name: Developer

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  copilot-requests: write

jobs:
  developer:
    uses: ./.github/workflows/copilot-common.yaml
    with:
      model: "GPT-5.6 Sol"
      prompt: |
        Issue title:
        ${{ github.event.issue.title }}

        Issue description:
        ${{ github.event.issue.body }}

        Directly commit and push to the main branch.
    secrets: inherit