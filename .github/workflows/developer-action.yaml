name: Developer

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  copilot-requests: write

jobs:
  developer:
    uses: ./.github/workflows/copilot-common.yaml
    with:
      model: "GPT-5.6 Sol"
      prompt: |
        Adapt the existing ASP.NET Core console application so that it produces 10 times the name Ines in the output.

        Directly commit and push to the main branch.
    secrets: inherit