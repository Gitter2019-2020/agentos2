name: Auto Approve

on:
  workflow_run:
    workflows: ["Developer"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Merge PR
        run: |
          gh pr merge ${{ github.event.workflow_run.pull_requests[0].number }} \
            --auto \
            --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}