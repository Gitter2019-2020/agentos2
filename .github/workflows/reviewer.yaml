name: Auto Approve

on:
  pull_request:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Merge PR
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --auto \
            --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}